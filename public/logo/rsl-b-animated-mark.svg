<svg class="rsl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Red Strings Lab animated mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.rsl .t{fill:var(--t,#0D1321)}.rsl .g{fill:var(--g,#B8860B)}
.rsl .intro{transform-origin:42px 42px;animation:intro .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes intro{from{opacity:0;transform:scale(.4) rotate(-30deg)}to{opacity:1;transform:none}}
.rsl .tilt{transform-origin:42px 42px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.rsl:hover .tilt{transform:rotate(-14deg)}
.rsl .look{transform:translate(var(--mx,0px),var(--my,0px));transition:transform .25s ease-out}
.rsl .drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(2.5px,-2px)}50%{transform:translate(-1.5px,1.5px)}75%{transform:translate(-2.5px,-1px)}}
.rsl .glint{transform-origin:42px 42px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rsl .ping{transform-box:fill-box;transform-origin:center;opacity:.6;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.rsl .v{opacity:0;animation:show 16s var(--d) infinite both}
.rsl .v1{--d:0s}.rsl .v2{--d:4s}.rsl .v3{--d:8s}.rsl .v4{--d:12s}
@keyframes show{0%{opacity:0}2%,23%{opacity:1}25%,100%{opacity:0}}
.rsl .draw{stroke-dasharray:70;animation:draw 16s var(--d) infinite both}
@keyframes draw{0%{stroke-dashoffset:70}9%,100%{stroke-dashoffset:0}}
.rsl .pop{transform-box:fill-box;transform-origin:center;animation:pop 16s var(--d) infinite both;animation-delay:calc(var(--d) + var(--k,0)*.18s)}
@keyframes pop{0%{transform:scale(0)}4%{transform:scale(1.5)}7%,100%{transform:scale(1)}}
.rsl .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 16s var(--d) infinite both;animation-delay:calc(var(--d) + var(--k,0)*.18s)}
@keyframes grow{0%{transform:scaleY(0)}6%,100%{transform:scaleY(1)}}
.rsl .ch{opacity:0;animation:type .01s steps(1) calc(.8s + var(--i)*.07s) both}
@keyframes type{to{opacity:1}}
.rsl .cursor{opacity:0;animation:cur 3s steps(1) 1.5s both}
@keyframes cur{0%{opacity:1}16%{opacity:0}33%{opacity:1}50%{opacity:0}66%{opacity:1}83%,100%{opacity:0}}
.rsl .lab{opacity:0;transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.2,1.6,.4,1) 1.9s both}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-6deg)}to{opacity:1;transform:none}}
.rsl[data-view]:not([data-view="auto"]) *{animation:none!important}
.rsl[data-view="1"] .v1,.rsl[data-view="2"] .v2,.rsl[data-view="3"] .v3,.rsl[data-view="4"] .v4{opacity:1}
@media (prefers-reduced-motion:reduce){.rsl *{animation:none!important}.rsl .ch,.rsl .lab,.rsl .v1{opacity:1}}
</style><g class="intro"><g class="tilt"><g class="look"><g class="drift"><circle cx="42" cy="42" r="25.5" fill="#0D1321"/><g class="v v1"><polyline class="draw" points="26,52 36,40 44,47 58,30" fill="none" stroke="#EDEFF5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle class="pop" style="--k:0" cx="26" cy="52" r="4" fill="#F4C430"/><circle class="pop" style="--k:1" cx="36" cy="40" r="4" fill="#F4C430"/><circle class="pop" style="--k:2" cx="44" cy="47" r="4" fill="#F4C430"/><circle class="pop" style="--k:3" cx="58" cy="30" r="4" fill="#F4C430"/></g><g class="v v2"><rect class="bar" style="--k:0" x="28" y="44" width="6.5" height="12" rx="1.5" fill="#EDEFF5"/><rect class="bar" style="--k:1" x="37" y="36" width="6.5" height="20" rx="1.5" fill="#EDEFF5"/><rect class="bar" style="--k:2" x="46" y="26" width="6.5" height="30" rx="1.5" fill="#E63946"/><rect class="bar" style="--k:3" x="55" y="40" width="6.5" height="16" rx="1.5" fill="#EDEFF5"/></g><g class="v v3"><circle class="pop" style="--k:0" cx="28" cy="50" r="2.4" fill="#EDEFF5"/><circle class="pop" style="--k:1" cx="33" cy="44" r="2.4" fill="#EDEFF5"/><circle class="pop" style="--k:2" cx="38" cy="48" r="2.4" fill="#EDEFF5"/><circle class="pop" style="--k:3" cx="44" cy="41" r="2.4" fill="#EDEFF5"/><circle class="pop" style="--k:4" cx="49" cy="45" r="2.4" fill="#EDEFF5"/><circle class="pop" style="--k:5" cx="54" cy="38" r="2.4" fill="#EDEFF5"/><circle class="ping" cx="56" cy="55" r="4" fill="none" stroke="#F4C430" stroke-width="1.5"/><circle class="pop" style="--k:6" cx="56" cy="55" r="3.6" fill="#F4C430"/></g><g class="v v4"><path class="draw" d="M30 44L52 34L44 56Q50 62 58 56" fill="none" stroke="#E63946" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle class="pop" style="--k:0" cx="30" cy="44" r="4.5" fill="#F4C430"/><circle class="pop" style="--k:1" cx="52" cy="34" r="4.5" fill="#F4C430"/><circle class="pop" style="--k:2" cx="44" cy="56" r="4.5" fill="#F4C430"/></g><circle cx="42" cy="42" r="30" fill="none" stroke="#E63946" stroke-width="9"/><path class="glint" d="M42 12A30 30 0 0 1 72 42" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/><path d="M63.5 63.5L84 84" stroke="#E63946" stroke-width="11" stroke-linecap="round"/><circle class="ping" cx="86" cy="86" r="8.5" fill="none" stroke="#F4C430" stroke-width="2"/><circle  cx="86" cy="86" r="8.5" fill="#F4C430"/><circle cx="86" cy="86" r="3.1" fill="#0D1321"/></g></g></g></g></svg>